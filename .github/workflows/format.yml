name: Format

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift_format:
    name: swift-format
    if: github.event_name == 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode installation found under /Applications"; exit 1
          fi
          echo "Selected $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
      - name: Format
        run: make format
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Run swift-format
          branch: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: swift-format lint
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode installation found under /Applications"; exit 1
          fi
          echo "Selected $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
      - name: Lint
        run: |
          swift format lint \
            --configuration .swift-format \
            --strict \
            --parallel \
            --recursive \
            ./Package.swift ./Sources ./Tests ./Examples
