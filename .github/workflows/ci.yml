name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - '.editorconfig'
      - '**.gif'
      - '**.png'
      - '**.jpg'
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - '.editorconfig'
      - '**.gif'
      - '**.png'
      - '**.jpg'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test All Platforms
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode installation found under /Applications"; exit 1
          fi
          echo "Selected $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
      - name: Skip macro validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Run tests
        run: make test

  build-demo:
    name: Build TextualDemo
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode installation found under /Applications"; exit 1
          fi
          echo "Selected $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
      - name: Skip macro validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Build demo
        run: make build-demo

  backward-compatibility:
    name: Backward Compatibility (Xcode 16.4)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: |
          if [ ! -d /Applications/Xcode_16.4.app ]; then
            echo "::error::Xcode 16.4 not installed on this runner image"; exit 1
          fi
          sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Skip macro validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Test macOS
        run: make test-macos
